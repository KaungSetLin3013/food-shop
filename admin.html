<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin — Festival Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#1B2340;--navy2:#242E50;--navy3:#2E3C64;
  --mustard:#F5C842;--coral:#FF6B5B;--mint:#4ECDC4;--green:#4ade80;
  --text:#1B2340;--text2:#4A5480;--text3:#9AA0C0;
  --border:rgba(255,255,255,.10);--borderL:#E8E2D4;
  --r:14px;--r2:20px;--r3:28px;--sh:0 4px 20px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--navy);color:#fff;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 80% 10%,rgba(245,200,66,.06),transparent 60%);pointer-events:none;z-index:0}
button{cursor:pointer;font-family:inherit;border:none}
input,select,textarea{font-family:inherit}

/* PASSWORD GATE */
#pw-gate{position:fixed;inset:0;background:var(--navy);z-index:900;display:flex;align-items:center;justify-content:center;padding:20px}
#pw-gate::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(245,200,66,.08),transparent 65%)}
.pw-box{position:relative;z-index:1;text-align:center;max-width:360px;width:100%}
.pw-icon{font-size:3rem;margin-bottom:14px;display:block}
.pw-title{font-family:'Fredoka',sans-serif;font-size:1.9rem;font-weight:700;color:var(--mustard);margin-bottom:6px}
.pw-sub{color:var(--text3);font-size:.85rem;margin-bottom:28px}
.pw-card{background:var(--navy2);border:1px solid var(--border);border-radius:var(--r3);padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.pw-label{font-size:.75rem;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:9px;text-align:left}
.pw-input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:var(--r);background:var(--navy3);color:#fff;font-size:1rem;text-align:center;letter-spacing:.12em;transition:border-color .15s}
.pw-input:focus{outline:none;border-color:var(--mustard);box-shadow:0 0 0 3px rgba(245,200,66,.12)}
.pw-btn{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--mustard),#e6b800);color:var(--navy);border-radius:var(--r);padding:13px;font-size:1rem;font-weight:900;font-family:'Fredoka',sans-serif;box-shadow:0 4px 14px rgba(245,200,66,.35);transition:all .15s}
.pw-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(245,200,66,.45)}
.pw-err{color:var(--coral);font-size:.8rem;font-weight:700;margin-top:8px;min-height:18px}

/* HEADER */
.hdr{background:rgba(27,35,64,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;gap:10px;flex-wrap:wrap}
.hdr-title{font-family:'Fredoka',sans-serif;font-size:1.35rem;font-weight:700;color:var(--mustard)}
.hdr-r{display:flex;gap:8px;align-items:center}
.hdr-link{background:var(--navy2);border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:7px 13px;font-size:.77rem;font-weight:700;text-decoration:none;transition:all .15s}
.hdr-link:hover{background:var(--navy3);color:#fff}
.logout-btn{background:rgba(255,107,91,.12);border:1px solid rgba(255,107,91,.2);color:var(--coral);border-radius:8px;padding:7px 13px;font-size:.77rem;font-weight:700}
.logout-btn:hover{background:rgba(255,107,91,.2)}

/* LAYOUT */
.awrap{max-width:1140px;margin:0 auto;padding:22px 22px 80px;position:relative;z-index:1}

/* TABS */
.atabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.at{padding:8px 18px;border-radius:8px;background:var(--navy2);border:1.5px solid var(--border);color:var(--text3);font-size:.83rem;font-weight:700;transition:all .15s}
.at:hover{color:#fff}
.at.on{background:var(--navy3);color:var(--mustard);border-color:rgba(245,200,66,.3)}

/* PANEL */
.panel{display:none}
.panel.on{display:block}

/* CARD */
.acard{background:var(--navy2);border:1px solid var(--border);border-radius:var(--r2);padding:20px;box-shadow:var(--sh)}
.acard+.acard{margin-top:16px}
.acard-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.acard-title{font-family:'Fredoka',sans-serif;font-size:1.05rem;font-weight:700;color:var(--mustard)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.sbox{background:var(--navy2);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.sbox-icon{font-size:1.7rem;margin-bottom:5px}
.sbox-val{font-family:'Fredoka',sans-serif;font-size:1.5rem;font-weight:700;color:var(--mustard)}
.sbox-lbl{font-size:.7rem;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}

/* TABLE */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{padding:7px 11px;text-align:left;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border-bottom:1px solid var(--border)}
.tbl td{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
.tbl tr:hover td{background:rgba(255,255,255,.03)}
.spill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.68rem;font-weight:800;text-transform:capitalize}
.spill.pending  {background:rgba(245,200,66,.15);color:var(--mustard)}
.spill.preparing{background:rgba(78,205,196,.15);color:var(--mint)}
.spill.ready    {background:rgba(74,222,128,.15);color:var(--green)}
.spill.done     {background:rgba(255,255,255,.07);color:var(--text3)}
.spill.cancelled{background:rgba(255,107,91,.15);color:var(--coral)}

/* ITEM LIST */
.item-list{display:flex;flex-direction:column;gap:8px}
.irow{display:flex;align-items:center;gap:12px;background:var(--navy3);border-radius:var(--r);padding:11px 14px}
.irow-img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;overflow:hidden}
.irow-img img{width:100%;height:100%;object-fit:cover}
.irow-info{flex:1;min-width:0}
.irow-name{font-weight:800;font-size:.88rem;color:#fff;line-height:1.2}
.irow-jp{font-size:.73rem;color:var(--text3)}
.irow-meta{font-size:.73rem;color:var(--text3);margin-top:2px}
.irow-price{font-family:'Fredoka',sans-serif;font-weight:700;color:var(--mustard);font-size:.92rem;flex-shrink:0}
.irow-actions{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap}

/* BUTTONS */
.btn{padding:7px 14px;border-radius:8px;font-size:.78rem;font-weight:800;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--mustard);color:var(--navy)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 3px 12px rgba(245,200,66,.35)}
.btn-danger{background:rgba(255,107,91,.15);color:var(--coral)}
.btn-danger:hover{background:rgba(255,107,91,.25)}
.btn-ghost{background:rgba(255,255,255,.07);color:var(--text3)}
.btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}
.btn-mint{background:rgba(78,205,196,.12);color:var(--mint)}
.btn-mint:hover{background:rgba(78,205,196,.2)}
.btn-edit{background:rgba(245,200,66,.12);color:var(--mustard)}
.btn-edit:hover{background:rgba(245,200,66,.22)}
.btn-sm{padding:5px 10px;font-size:.72rem}
.btn-checkout{background:linear-gradient(135deg,var(--green),#16a34a);color:#fff;box-shadow:0 3px 10px rgba(74,222,128,.3)}
.btn-checkout:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(74,222,128,.4)}

/* STATUS SELECT */
.ssel{padding:5px 9px;border-radius:7px;background:var(--navy3);color:#fff;border:1px solid var(--border);font-size:.75rem;font-family:'Nunito',sans-serif;cursor:pointer}

/* FORM */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:.72rem;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;background:var(--navy3);color:#fff;font-size:.88rem;transition:border-color .15s;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--mustard);box-shadow:0 0 0 3px rgba(245,200,66,.1)}
.fld select option{background:var(--navy)}
.fld textarea{resize:vertical;min-height:60px}
.fld-full{grid-column:1/-1}
.chk-label{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--text3);font-weight:700;cursor:pointer;grid-column:1/-1}
.chk-label input{width:16px;height:16px;accent-color:var(--mustard);cursor:pointer}

/* IMAGE UPLOAD */
.img-upload{border:2px dashed var(--border);border-radius:var(--r);padding:20px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text3);font-size:.82rem;font-weight:700;grid-column:1/-1}
.img-upload:hover{border-color:rgba(245,200,66,.4);color:var(--mustard);background:rgba(245,200,66,.04)}
.img-upload.has-img{padding:0;border-style:solid}
.img-upload.has-img img{width:100%;height:160px;object-fit:cover;border-radius:calc(var(--r) - 2px)}
.img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.img-upload-icon{font-size:2rem}
.img-uploading{color:var(--mint);animation:pulse 1s infinite}

/* SET COMPONENTS SELECTOR */
.set-comps-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;background:var(--navy3);border-radius:var(--r);padding:8px}
.set-comp-item{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer;transition:background .12s}
.set-comp-item:hover{background:rgba(255,255,255,.07)}
.set-comp-item input{width:15px;height:15px;accent-color:var(--mustard);cursor:pointer;flex-shrink:0}
.set-comp-item label{font-size:.82rem;font-weight:700;color:#fff;cursor:pointer}
.set-comp-item .sc-jp{font-size:.72rem;color:var(--text3)}

/* CHECKOUT TABLE VIEW */
.table-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.table-card{background:var(--navy3);border:1.5px solid var(--border);border-radius:var(--r2);padding:16px;cursor:pointer;transition:all .18s}
.table-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3);border-color:rgba(245,200,66,.3)}
.table-card.has-orders{border-color:rgba(74,222,128,.3)}
.table-card.checked-out{border-color:var(--text3);opacity:.6}
.tc-num{font-family:'Fredoka',sans-serif;font-size:1.4rem;font-weight:700;color:var(--mustard);margin-bottom:4px}
.tc-orders{font-size:.78rem;color:var(--text3);font-weight:700}
.tc-total{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:700;color:var(--green);margin-top:6px}
.tc-status{font-size:.7rem;font-weight:800;margin-top:4px}

/* RECEIPT (print) */
@media print {
  body > *:not(#receipt-modal){ display:none!important }
  #receipt-modal{ display:block!important; position:static!important; background:#fff!important }
  .receipt-box{ box-shadow:none!important; max-width:100%!important; border:none!important }
  .no-print{ display:none!important }
}
.receipt-box{background:#fff;color:#1B2340;border-radius:var(--r2);padding:28px;max-width:380px;width:100%;font-family:'Courier New',monospace;box-shadow:var(--sh)}
.rcpt-center{text-align:center}
.rcpt-shop{font-family:'Fredoka',sans-serif;font-size:1.5rem;font-weight:700;color:#1B2340;margin-bottom:2px}
.rcpt-tag{font-size:.78rem;color:#666;margin-bottom:12px}
.rcpt-divider{border:none;border-top:1px dashed #ccc;margin:10px 0}
.rcpt-row{display:flex;justify-content:space-between;font-size:.82rem;padding:2px 0}
.rcpt-row.bold{font-weight:700}
.rcpt-row.total{font-size:1rem;font-weight:900;border-top:2px solid #1B2340;padding-top:6px;margin-top:4px}
.rcpt-footer{text-align:center;font-size:.75rem;color:#888;margin-top:12px;font-style:italic}
.rcpt-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:#999;margin:8px 0 4px;font-family:'Nunito',sans-serif;font-weight:800}

/* EMPTY / LOADER */
.empty-s{text-align:center;padding:40px;color:var(--text3);grid-column:1/-1}
.empty-s .big{font-size:2.8rem;margin-bottom:8px}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--mustard);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* SEARCH */
.search-wrap{position:relative;flex:1;min-width:140px}
.search-wrap input{width:100%;padding:7px 11px 7px 30px;border-radius:8px;border:1px solid var(--border);background:var(--navy3);color:#fff;font-size:.82rem}
.search-wrap input:focus{outline:none;border-color:var(--mustard)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.82rem;pointer-events:none}

@media(max-width:640px){.fgrid{grid-template-columns:1fr}.fld-full,.chk-label{grid-column:1}.table-cards{grid-template-columns:repeat(2,1fr)}.atabs{gap:4px}.at{padding:6px 10px;font-size:.76rem}}
</style>
</head>
<body>

<!-- PASSWORD GATE -->
<div id="pw-gate">
  <div class="pw-box">
    <span class="pw-icon">🔐</span>
    <div class="pw-title">Admin Panel</div>
    <p class="pw-sub">Staff access only</p>
    <div class="pw-card">
      <label class="pw-label" for="pw-in">Password</label>
      <input class="pw-input" type="password" id="pw-in" placeholder="••••••••" autocomplete="current-password"/>
      <button class="pw-btn" id="pw-btn">Unlock →</button>
      <div class="pw-err" id="pw-err"></div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="admin-app" style="display:none">
  <header class="hdr">
    <div class="hdr-title">⚙️ Admin Panel</div>
    <div class="hdr-r">
      <a class="hdr-link" href="kitchen.html">👨‍🍳 Kitchen</a>
      <button class="logout-btn" id="logout-btn">🚪 Logout</button>
    </div>
  </header>

  <div class="awrap">
    <div class="atabs">
      <button class="at on" data-p="p-dash">📊 Dashboard</button>
      <button class="at" data-p="p-checkout">💳 Checkout</button>
      <button class="at" data-p="p-orders">📋 Orders</button>
      <button class="at" data-p="p-menu">🍽 Menu</button>
      <button class="at" data-p="p-cats">🗂 Categories</button>
      <button class="at" data-p="p-settings">⚙️ Settings</button>
    </div>

    <!-- DASHBOARD -->
    <div class="panel on" id="p-dash">
      <div class="stats-grid" id="stats"></div>
      <div class="acard">
        <div class="acard-title" style="margin-bottom:14px">Recent Orders</div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>#</th><th>Table</th><th>Total</th><th>Status</th><th>Time</th></tr></thead>
            <tbody id="dash-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- CHECKOUT -->
    <div class="panel" id="p-checkout">
      <div class="acard" style="margin-bottom:16px">
        <div class="acard-title" style="margin-bottom:14px">Select Table to Check Out</div>
        <div class="table-cards" id="table-cards">
          <div class="spin"></div>
        </div>
      </div>
    </div>

    <!-- ORDERS -->
    <div class="panel" id="p-orders">
      <div class="acard">
        <div class="acard-hd">
          <div class="acard-title">All Orders</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <select class="ssel" id="orders-filter" onchange="loadOrders()">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="preparing">Preparing</option>
              <option value="ready">Ready</option>
              <option value="done">Done</option>
              <option value="cancelled">Cancelled</option>
            </select>
            <button class="btn btn-danger btn-sm" onclick="clearOrders()">Clear All</button>
          </div>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>#</th><th>Table</th><th>Items</th><th>Total</th><th>Status</th><th>Time</th><th>Action</th></tr></thead>
            <tbody id="orders-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- MENU -->
    <div class="panel" id="p-menu">
      <div class="acard">
        <div class="acard-hd">
          <div class="acard-title">Menu Items</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <div class="search-wrap"><span class="search-icon">🔍</span><input id="menu-search" placeholder="Search…" oninput="renderMenu()"/></div>
            <button class="btn btn-primary" onclick="openItemModal(null)">+ Add Item</button>
          </div>
        </div>
        <div class="item-list" id="menu-list"></div>
      </div>
    </div>

    <!-- CATEGORIES -->
    <div class="panel" id="p-cats">
      <div class="acard">
        <div class="acard-hd">
          <div class="acard-title">Categories</div>
          <button class="btn btn-primary" onclick="openCatModal(null)">+ Add Category</button>
        </div>
        <div class="item-list" id="cat-list"></div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="panel" id="p-settings">
      <div class="acard">
        <div class="acard-title" style="margin-bottom:16px">Shop Settings</div>
        <div class="fgrid">
          <div class="fld"><label>Shop Name</label><input id="s-name" placeholder="Festival Shop"/></div>
          <div class="fld"><label>Tagline</label><input id="s-tag" placeholder="School Festival 2025"/></div>
          <div class="fld"><label>Logo Emoji</label><input id="s-emoji" placeholder="🎪" maxlength="4"/></div>
          <div class="fld"><label>Currency Symbol</label><input id="s-cur" placeholder="¥" maxlength="4"/></div>
          <div class="fld"><label>Tax / Service (%)</label><input id="s-tax" type="number" min="0" max="100" step="0.1" placeholder="0"/></div>
          <div class="fld"><label>Receipt Message</label><input id="s-rcpt" placeholder="Thank you!"/></div>
          <div class="fld"><label>Admin Password</label><input id="s-pw" type="password" placeholder="New password"/></div>
        </div>
        <button class="btn btn-primary" style="margin-top:16px" onclick="saveSettings()">💾 Save Settings</button>
      </div>
    </div>
  </div>
</div>

<!-- RECEIPT MODAL -->
<div id="receipt-modal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:900;display:none;align-items:center;justify-content:center;padding:16px">
  <div class="receipt-box" id="receipt-content"></div>
</div>

<div id="toast-area"></div>

<script type="module">
import { sb, getSettings, saveSetting, fmt, timeAgo, esc, padNum, toast, confirmDialog } from './supabase-config.js';

// ── State ──────────────────────────────────────────────────
let settings   = {};
let categories = [];
let menuItems  = [];
let orders     = [];
let authed     = false;

// ── Password gate ──────────────────────────────────────────
settings = await getSettings();
applySettings();

document.getElementById('pw-in').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('pw-btn').click(); });
document.getElementById('pw-btn').addEventListener('click', () => {
  const val = document.getElementById('pw-in').value;
  if (val === (settings.admin_password || 'admin1234')) {
    authed = true;
    document.getElementById('pw-gate').style.display    = 'none';
    document.getElementById('admin-app').style.display  = 'block';
    boot();
  } else {
    document.getElementById('pw-err').textContent = '❌ Incorrect password';
    document.getElementById('pw-in').value = '';
    document.getElementById('pw-in').focus();
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  authed = false;
  document.getElementById('admin-app').style.display = 'none';
  document.getElementById('pw-gate').style.display   = 'flex';
  document.getElementById('pw-in').value = '';
});

// ── Boot ───────────────────────────────────────────────────
async function boot() {
  const [{ data: cats }, { data: items }] = await Promise.all([
    sb.from('categories').select('*').order('sort_order'),
    sb.from('menu_items').select('*').order('created_at'),
  ]);
  categories = cats  || [];
  menuItems  = items || [];
  await loadOrders();
  renderDash();
  renderMenu();
  renderCats();
  loadSettingsForm();
  renderCheckout();
  subscribeRealtime();
}

// ── Realtime ───────────────────────────────────────────────
function subscribeRealtime() {
  sb.channel('admin-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, async () => {
      await loadOrders();
      renderDash();
      renderCheckout();
      if (document.getElementById('p-orders').classList.contains('on')) renderOrders();

}

// ── Dashboard ──────────────────────────────────────────────
function renderDash() {
  const sym   = settings.currency || '¥';
  const today = new Date().toDateString();
  const todayO= orders.filter(o => new Date(o.created_at).toDateString()===today);
  const rev   = orders.filter(o=>o.status==='done').reduce((s,o)=>s+Number(o.total),0);
  const pend  = orders.filter(o=>o.status==='pending').length;

  document.getElementById('stats').innerHTML = [
    {icon:'📋',val:orders.length,        lbl:'Total Orders'},
    {icon:'⏳',val:pend,                 lbl:'Pending'},
    {icon:'💰',val:fmt(rev,sym),         lbl:'Revenue'},
    {icon:'📅',val:todayO.length,        lbl:'Today'},
  ].map(s=>`<div class="sbox"><div class="sbox-icon">${s.icon}</div><div class="sbox-val">${s.val}</div><div class="sbox-lbl">${s.lbl}</div></div>`).join('');

  const tbody = document.getElementById('dash-tbody');
  const recent = orders.slice(0,10);
  if (!recent.length) { tbody.innerHTML='<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text3)">No orders yet</td></tr>'; return; }
  tbody.innerHTML = recent.map(o=>`<tr>
    <td><b>#${padNum(o.order_number)}</b></td>
    <td>Table ${esc(o.table_num)}</td>
    <td style="font-family:'Fredoka',sans-serif;color:var(--mustard)">${fmt(o.total,sym)}</td>
    <td><span class="spill ${o.status}">${o.status}</span></td>
    <td style="color:var(--text3);font-size:.76rem">${timeAgo(o.created_at)}</td>
  </tr>`).join('');
}

// ── Load orders ────────────────────────────────────────────
window.loadOrders = async function() {
  const filter = document.getElementById('orders-filter')?.value;
  let q = sb.from('orders').select('*, order_items(item_name,item_name_jp,quantity,unit_price)')
    .order('created_at',{ascending:false}).limit(300);
  if (filter) q = q.eq('status', filter);
  const {data} = await q;
  orders = data || [];
  renderOrders();
}

function renderOrders() {
  const sym = settings.currency||'¥';
  const tbody = document.getElementById('orders-tbody');
  if (!tbody) return;
  if (!orders.length) { tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text3)">No orders</td></tr>'; return; }
  tbody.innerHTML = orders.map(o=>{
    const its = (o.order_items||[]).map(i=>`${i.quantity}× ${esc(i.item_name_jp||i.item_name)}`).join(', ');
    return `<tr>
      <td><b>#${padNum(o.order_number)}</b></td>
      <td>Table ${esc(o.table_num)}</td>
      <td style="font-size:.76rem;color:var(--text3);max-width:200px">${its}</td>
      <td style="font-family:'Fredoka',sans-serif;color:var(--mustard)">${fmt(o.total,sym)}</td>
      <td><span class="spill ${o.status}">${o.status}</span></td>
      <td style="color:var(--text3);font-size:.75rem">${timeAgo(o.created_at)}</td>
      <td><select class="ssel" onchange="updateStatus('${o.id}',this.value)">
        ${['pending','preparing','ready','done','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
      </select></td>

window.updateStatus = async function(id, status) {
  const {error} = await sb.from('orders').update({status}).eq('id',id);
  if (error) toast('Error: '+error.message,'error');
  else { toast('Status updated','success'); await loadOrders(); }
}

window.clearOrders = async function() {
  const ok = await confirmDialog('Delete ALL orders? This cannot be undone.');
  if (!ok) return;
  await sb.from('order_items').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await sb.from('orders').delete().neq('id','00000000-0000-0000-0000-000000000000');
  await loadOrders(); renderDash();
  toast('All orders cleared','success');
}

// ── CHECKOUT ───────────────────────────────────────────────
async function renderCheckout() {
  const cont = document.getElementById('table-cards');
  if (!cont) return;

  // Get all orders not checked out
  const {data:allOrders} = await sb.from('orders')
    .select('*, order_items(item_name,item_name_jp,item_emoji,item_image,quantity,unit_price,is_set,order_item_components(component_name,component_emoji))')
    .eq('checked_out', false)
    .neq('status','cancelled')
    .order('created_at',{ascending:true});

  const byTable = {};
  (allOrders||[]).forEach(o => {
    if (!byTable[o.table_num]) byTable[o.table_num] = [];
    byTable[o.table_num].push(o);
  });

  if (!Object.keys(byTable).length) {
    cont.innerHTML = `<div class="empty-s"><div class="big">💳</div><p style="font-weight:700">No active tables</p></div>`;
    return;
  }

  const sym = settings.currency||'¥';
  cont.innerHTML = Object.entries(byTable).map(([tbl,ords])=>{
    const total     = ords.reduce((s,o)=>s+Number(o.total),0);
    const allDone   = ords.every(o=>o.status==='done');
    return `
      <div class="table-card has-orders" onclick="openCheckout('${tbl}')">
        <div class="tc-num">🪑 Table ${esc(tbl)}</div>
        <div class="tc-orders">${ords.length} order${ords.length!==1?'s':''}</div>
        <div class="tc-total">${fmt(Math.round(total),sym)}</div>
        <div class="tc-status" style="color:${allDone?'var(--green)':'var(--mustard)'}">
          ${allDone?'✅ Ready to checkout':'⏳ In progress'}
        </div>
      </div>
    `;
  }).join('');
}

window.openCheckout = async function(tableNum) {
  const sym = settings.currency||'¥';
  const {data:allOrders} = await sb.from('orders')
    .select('*, order_items(*, order_item_components(component_name,component_emoji))')
    .eq('table_num', tableNum)
    .eq('checked_out', false)
    .neq('status','cancelled')
    .order('created_at',{ascending:true});

  if (!allOrders?.length) { toast('No active orders for this table','warning'); return; }

  const subtotal = allOrders.reduce((s,o)=>s+Number(o.total),0);
  const tax      = subtotal*(parseFloat(settings.tax||0)/100);
  const total    = subtotal+tax;

  // Build receipt preview
  const allItems = [];
  allOrders.forEach(o=>{
    (o.order_items||[]).forEach(oi=>{
      allItems.push({
        name: oi.item_name_jp||oi.item_name, emoji:oi.item_emoji||'🍽',
        qty:oi.quantity, price:oi.unit_price, is_set:oi.is_set,
        comps:(oi.order_item_components||[]).map(c=>c.component_emoji+' '+c.component_name),
      });
    });
  });

  const receiptHTML = buildReceiptHTML(tableNum, allItems, subtotal, tax, total, false);

  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto';
  overlay.innerHTML=`
    <div style="background:var(--navy2);border-radius:var(--r3);padding:24px;width:100%;max-width:440px;box-shadow:0 16px 48px rgba(0,0,0,.5)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
        <span style="font-family:'Fredoka',sans-serif;font-size:1.2rem;font-weight:700;color:var(--mustard)">Checkout — Table ${esc(tableNum)}</span>
        <button onclick="this.closest('[style]').remove()" style="background:rgba(255,255,255,.08);color:var(--text3);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:.85rem">✕</button>
      </div>
      ${receiptHTML}
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap" class="no-print">
        <button class="btn btn-ghost" onclick="printReceipt('${tableNum}')">🖨 Print Receipt</button>
        <button class="btn btn-checkout" style="flex:1" onclick="completeCheckout('${tableNum}',${Math.round(total)},this)">
          ✅ Complete Checkout — ${fmt(Math.round(total),sym)}
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.remove(); });
}

function buildReceiptHTML(tableNum, items, subtotal, tax, total, forPrint) {
  const sym  = settings.currency||'¥';
  const name = settings.shop_name||'Festival Shop';
  const tag  = settings.tagline||'';
  const msg  = settings.receipt_msg||'Thank you!';
  const now  = new Date().toLocaleString();

  return `
    <div class="receipt-box" ${forPrint?'id="receipt-print"':''}>
      <div class="rcpt-center">
        <div class="rcpt-shop">${esc(name)}</div>
        ${tag?`<div class="rcpt-tag">${esc(tag)}</div>`:''}
      </div>
      <hr class="rcpt-divider"/>
      <div class="rcpt-row bold"><span>Table</span><span>${esc(tableNum)}</span></div>
      <div class="rcpt-row"><span>Date</span><span style="font-size:.75rem">${now}</span></div>
      <hr class="rcpt-divider"/>
      <div class="rcpt-label">Order Items</div>
      ${items.map(it=>`
        <div class="rcpt-row"><span>${esc(it.emoji)} ${esc(it.name)} ×${it.qty}</span><span>${fmt(it.price*it.qty,sym)}</span></div>
        ${it.comps?.length?`<div style="font-size:.7rem;color:#888;padding-left:12px">(${it.comps.map(c=>esc(c)).join(', ')})</div>`:''}
      `).join('')}
      <hr class="rcpt-divider"/>
      <div class="rcpt-row"><span>Subtotal</span><span>${fmt(subtotal,sym)}</span></div>
      ${parseFloat(settings.tax||0)>0?`<div class="rcpt-row"><span>Tax (${settings.tax}%)</span><span>${fmt(Math.round(tax),sym)}</span></div>`:''}
      <div class="rcpt-row total"><span>TOTAL</span><span>${fmt(Math.round(total),sym)}</span></div>
      <hr class="rcpt-divider"/>
      <div class="rcpt-footer">${esc(msg)}</div>
    </div>

window.printReceipt = async function(tableNum) {
  const sym = settings.currency||'¥';
  const {data:allOrders} = await sb.from('orders')
    .select('*, order_items(*, order_item_components(component_name,component_emoji))')
    .eq('table_num',tableNum).eq('checked_out',false).neq('status','cancelled');

  const allItems=[];
  (allOrders||[]).forEach(o=>(o.order_items||[]).forEach(oi=>{
    allItems.push({name:oi.item_name_jp||oi.item_name,emoji:oi.item_emoji||'🍽',qty:oi.quantity,price:oi.unit_price,comps:(oi.order_item_components||[]).map(c=>c.component_emoji+' '+c.component_name)});

window.completeCheckout = async function(tableNum, total, btn) {
  btn.disabled=true; btn.textContent='Processing…';
  const {data:ords} = await sb.from('orders').select('id').eq('table_num',tableNum).eq('checked_out',false);
  if (!ords?.length) { toast('No orders found','error'); return; }
  const ids = ords.map(o=>o.id);
  await sb.from('orders').update({checked_out:true,status:'done',checked_out_at:new Date().toISOString()}).in('id',ids);

    const {data}=await sb.from('set_components').select('component_id').eq('set_id',id);
    existingComps=(data||[]).map(c=>c.component_id);
  }

  const catOpts=categories.map(c=>`<option value="${c.id}" ${it?.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('');

  const bodyHTML=`
    <div class="fgrid">
      <div class="fld img-upload ${it?.image_url?'has-img':''}" id="upload-area" onclick="document.getElementById('img-file').click()">
        ${it?.image_url?`<img src="${esc(it.image_url)}" id="img-preview"/>`:'<div class="img-upload-icon">🖼</div><span>Click to upload image</span>'}
        <input type="file" id="img-file" accept="image/*" style="display:none"/>
        <input type="hidden" id="img-url" value="${esc(it?.image_url||'')}"/>
      </div>

      <div class="fld"><label>Emoji</label><input id="mi-emoji" value="${esc(it?.emoji||'')}" placeholder="🍜" maxlength="4"/></div>
      <div class="fld"><label>Category</label><select id="mi-cat"><option value="">— none —</option>${catOpts}</select></div>
      <div class="fld fld-full"><label>Description</label><textarea id="mi-desc" placeholder="Short description…" maxlength="180">${esc(it?.description||'')}</textarea></div>
      <div class="fld"><label>Price *</label><input id="mi-price" type="number" value="${it?.price||''}" min="0" step="1"/></div>
      <div class="chk-label"><input type="checkbox" id="mi-avail" ${!it||it.available?'checked':''}/> Available for ordering</div>
      <div class="chk-label"><input type="checkbox" id="mi-set" ${it?.is_set?'checked':''} onchange="toggleSetComps(this.checked)"/> This is a SET menu</div>
      <div class="fld fld-full" id="set-comps-wrap" style="display:${it?.is_set?'flex':'none'};flex-direction:column;gap:6px">

              <input type="checkbox" id="sc-${ci.id}" value="${ci.id}" ${existingComps.includes(ci.id)?'checked':''}/>
              <label for="sc-${ci.id}">
                ${esc(ci.emoji||'🍽')} ${esc(ci.name)}
                ${ci.name_jp?`<span class="sc-jp">(${esc(ci.name_jp)})</span>`:''}
              </label>
            </div>
          `).join('')}
        </div>

  const modal=document.getElementById('_modal_bg')||createModalEl();

window.toggleSetComps=function(show){ document.getElementById('set-comps-wrap').style.display=show?'flex':'none'; }

async function saveItem(it) {
  const name=document.getElementById('mi-name').value.trim();
  const price=parseFloat(document.getElementById('mi-price').value);
  if (!name) { toast('Name is required','error'); return false; }
  if (isNaN(price)) { toast('Price is required','error'); return false; }

  const imgUrl=document.getElementById('img-url')?.value||it?.image_url||null;
  const isSet=document.getElementById('mi-set').checked;

  const payload={
    name, name_jp:document.getElementById('mi-jp').value.trim()||null,
    emoji:document.getElementById('mi-emoji').value.trim()||'🍽',
    description:document.getElementById('mi-desc').value.trim()||null,
    price, image_url:imgUrl,
    category_id:document.getElementById('mi-cat').value||null,
    available:document.getElementById('mi-avail').checked,
    is_set:isSet,
  };

  const {data,error}=it
    ?await sb.from('menu_items').update(payload).eq('id',it.id).select().single()
    :await sb.from('menu_items').insert(payload).select().single();

  if (error) { toast('Error: '+error.message,'error'); return false; }

  // Save set components
  if (isSet && data) {
    await sb.from('set_components').delete().eq('set_id',data.id);
    const checked=[...document.querySelectorAll('[id^="sc-"]:checked')].map(c=>c.value);
    if (checked.length) {
      await sb.from('set_components').insert(checked.map((cid,i)=>({set_id:data.id,component_id:cid,sort_order:i})));
    }
  }

  if (it) menuItems=menuItems.map(x=>x.id===it.id?data:x);
  else menuItems.unshift(data);
  renderMenu();
  toast(it?'Item updated!':'Item added!','success');
  return true;
}

window.toggleAvail=async function(id,cur) {
  const {data,error}=await sb.from('menu_items').update({available:!cur}).eq('id',id).select().single();
  if (error) { toast('Error: '+error.message,'error'); return; }
  menuItems=menuItems.map(x=>x.id===id?data:x);
  renderMenu();
  toast(!cur?'Item enabled':'Item disabled','success');
}

window.deleteItem=async function(id) {
  const ok=await confirmDialog('Delete this menu item?');
  if (!ok) return;
  await sb.from('menu_items').delete().eq('id',id);
  menuItems=menuItems.filter(x=>x.id!==id);
  renderMenu();
  toast('Item deleted','success');
}

  document.getElementById('_modal_body').innerHTML=`
    <div class="fgrid">
      <div class="fld fld-full"><label>Name * (with emoji!)</label><input id="cat-name" value="${esc(cat?.name||'')}" placeholder="🍜 Noodles" maxlength="40"/></div>
      <div class="fld"><label>Sort Order</label><input id="cat-ord" type="number" value="${cat?.sort_order||0}" min="0"/></div>
    </div>
  `;
  modal.style.display='flex';
  const foot=document.getElementById('_modal_foot');
  foot.innerHTML='';
  const saveBtn=document.createElement('button');
  saveBtn.textContent=cat?'Save':'Add';
  saveBtn.style.cssText='padding:9px 20px;border-radius:8px;font-size:.85rem;font-weight:800;cursor:pointer;border:none;font-family:Nunito,sans-serif;background:#F5C842;color:#1B2340';
  saveBtn.onclick=async()=>{
    const name=document.getElementById('cat-name').value.trim();
    const ord=parseInt(document.getElementById('cat-ord').value)||0;
    if (!name) { toast('Name required','error'); return; }
    const {data,error}=cat
      ?await sb.from('categories').update({name,sort_order:ord}).eq('id',cat.id).select().single()
      :await sb.from('categories').insert({name,sort_order:ord}).select().single();
    if (error) { toast('Error: '+error.message,'error'); return; }
    if (cat) categories=categories.map(c=>c.id===cat.id?data:c);
    else categories.push(data);
    renderCats();
    modal.style.display='none';
    toast(cat?'Updated':'Added','success');
  };
  const cancelBtn=document.createElement('button');
  cancelBtn.textContent='Cancel';
  cancelBtn.style.cssText='padding:9px 20px;border-radius:8px;font-size:.85rem;font-weight:800;cursor:pointer;border:none;font-family:Nunito,sans-serif;background:rgba(255,255,255,.07);color:#9AA0C0';
  cancelBtn.onclick=()=>{ modal.style.display='none'; };
  foot.appendChild(cancelBtn); foot.appendChild(saveBtn);
}

window.deleteCat=async function(id) {
  const ok=await confirmDialog('Delete this category?');
  if (!ok) return;
  await sb.from('categories').delete().eq('id',id);
  categories=categories.filter(c=>c.id!==id);
  renderCats();
  toast('Deleted','success');
}

// ── SETTINGS ───────────────────────────────────────────────
function loadSettingsForm() {
  document.getElementById('s-name').value=settings.shop_name||'';
  document.getElementById('s-tag').value =settings.tagline||'';
  document.getElementById('s-emoji').value=settings.emoji||'🎪';
  document.getElementById('s-cur').value =settings.currency||'¥';
  document.getElementById('s-tax').value =settings.tax||'0';
  document.getElementById('s-rcpt').value=settings.receipt_msg||'';
}

window.saveSettings=async function() {
  const updates={
    shop_name: document.getElementById('s-name').value.trim()||'Festival Shop',
    tagline:   document.getElementById('s-tag').value.trim(),
    emoji:     document.getElementById('s-emoji').value.trim()||'🎪',
    currency:  document.getElementById('s-cur').value.trim()||'¥',
    tax:       document.getElementById('s-tax').value||'0',
    receipt_msg:document.getElementById('s-rcpt').value.trim(),
  };
  const newPw=document.getElementById('s-pw').value.trim();
  if (newPw) updates.admin_password=newPw;

  for (const [k,v] of Object.entries(updates)) await saveSetting(k,v);
  settings={...settings,...updates};
  applySettings();
  toast('Settings saved!','success');
}

// ── Modal el helper ────────────────────────────────────────
function createModalEl() {
  const bg=document.createElement('div');
  bg.id='_modal_bg';
  bg.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:800;display:none;align-items:center;justify-content:center;padding:16px';
  bg.innerHTML=`<div style="background:var(--navy2);border:1px solid var(--border);border-radius:var(--r3);padding:26px;width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;box-shadow:0 16px 48px rgba(0,0,0,.5)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <span id="_modal_title" style="font-family:'Fredoka',sans-serif;font-size:1.15rem;font-weight:700;color:var(--mustard)"></span>
      <button onclick="document.getElementById('_modal_bg').style.display='none'" style="background:rgba(255,255,255,.08);color:var(--text3);border-radius:8px;width:28px;height:28px;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;font-size:.85rem">✕</button>
    </div>
    <div id="_modal_body"></div>
    <div id="_modal_foot" style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px"></div>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{ if(e.target===bg) bg.style.display='none'; });
  return bg;
}
createModalEl();
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const m=document.getElementById('_modal_bg'); if(m) m.style.display='none'; }});
</script>
</body>
