<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Festival Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ── RESET & TOKENS ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F0EB;
  --surface:#FFFFFF;
  --navy:#1A2040;
  --navy2:#252E52;
  --brand:#E8390E;
  --brand2:#FF5733;
  --mustard:#F5C100;
  --mint:#00B69B;
  --text:#1A1A1A;
  --text2:#555;
  --text3:#999;
  --border:#E0DDD6;
  --r:12px;--r2:18px;--r3:26px;
  --sh:0 2px 12px rgba(0,0,0,.10);
  --sh2:0 6px 28px rgba(0,0,0,.16);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
button{cursor:pointer;font-family:inherit;border:none;background:none}
img{display:block;max-width:100%}

/* ── TABLE GATE ── */
#gate{
  position:fixed;inset:0;z-index:900;
  background:var(--navy);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
#gate::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 60% at 50% 30%, rgba(232,57,14,.18), transparent 65%);
  pointer-events:none;
}
.gate-inner{position:relative;z-index:1;width:100%;max-width:420px;text-align:center}
.gate-logo{font-size:5rem;margin-bottom:8px;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.gate-shop-name{font-family:'Fredoka',sans-serif;font-size:2.4rem;font-weight:700;color:#fff;margin-bottom:4px}
.gate-tagline{color:rgba(255,255,255,.5);font-size:.9rem;margin-bottom:36px}
.gate-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--r3);padding:32px}
.gate-lbl{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.5);margin-bottom:10px;text-align:left}
.gate-in{
  width:100%;padding:16px;border:2px solid rgba(255,255,255,.15);
  border-radius:var(--r);background:rgba(255,255,255,.08);
  color:#fff;font-size:1.4rem;font-family:'Fredoka',sans-serif;
  font-weight:600;text-align:center;letter-spacing:.06em;
  transition:border-color .2s;
}
.gate-in:focus{outline:none;border-color:var(--mustard)}
.gate-in::placeholder{color:rgba(255,255,255,.25)}
.gate-btn{
  width:100%;margin-top:14px;padding:16px;
  background:var(--brand);color:#fff;
  border-radius:var(--r);font-size:1.1rem;font-weight:900;
  font-family:'Fredoka',sans-serif;letter-spacing:.04em;
  box-shadow:0 4px 20px rgba(232,57,14,.5);
  transition:all .15s;
}
.gate-btn:hover{background:var(--brand2);transform:translateY(-2px)}
.gate-err{color:#FF6B5B;font-size:.82rem;font-weight:700;margin-top:8px;min-height:18px}

/* ── APP SHELL ── */
#app{display:none;flex:1;flex-direction:column;height:100%}
#app.visible{display:flex}

/* ── HEADER ── */
.app-hdr{
  background:var(--navy);color:#fff;
  padding:0 16px;
  display:flex;align-items:center;gap:12px;
  height:56px;flex-shrink:0;
  position:relative;z-index:100;
}
.hdr-logo{font-size:1.5rem;line-height:1}
.hdr-name{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;color:var(--mustard)}
.hdr-table{
  margin-left:auto;
  background:rgba(255,255,255,.1);border-radius:99px;
  padding:5px 12px;font-size:.78rem;font-weight:800;color:rgba(255,255,255,.8)
}
.hdr-orders-btn{
  position:relative;
  background:rgba(255,255,255,.1);border-radius:99px;
  padding:6px 12px;font-size:.78rem;font-weight:800;color:rgba(255,255,255,.8);
  display:flex;align-items:center;gap:5px;
  transition:background .15s;
}
.hdr-orders-btn:hover{background:rgba(255,255,255,.18)}
.hdr-dot{
  position:absolute;top:-2px;right:-2px;
  width:10px;height:10px;background:var(--brand);
  border-radius:50%;border:2px solid var(--navy);display:none;
}

/* ── MAIN CONTENT AREA ── */
.app-body{flex:1;display:flex;overflow:hidden;position:relative}

/* ── CATEGORY SIDEBAR ── */
.cat-rail{
  width:110px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;
  display:flex;flex-direction:column;
  padding:8px 0;
}
.cat-rail::-webkit-scrollbar{display:none}
.cat-btn{
  display:flex;flex-direction:column;align-items:center;
  gap:4px;padding:12px 6px;
  border-radius:0;border-left:3px solid transparent;
  font-size:.72rem;font-weight:700;color:var(--text2);
  text-align:center;line-height:1.3;
  transition:all .15s;cursor:pointer;
  width:100%;
}
.cat-btn:hover{background:#f7f5f1;color:var(--text)}
.cat-btn.active{
  background:#fff7f5;color:var(--brand);
  border-left-color:var(--brand);font-weight:800;
}
.cat-icon{font-size:1.6rem;line-height:1}

/* ── ITEM GRID ── */
.item-grid-wrap{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 14px 120px;
  scrollbar-width:thin;
  scrollbar-color:var(--border) transparent;
}
.section-title{
  font-size:.7rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.1em;color:var(--text3);
  margin-bottom:10px;padding-left:2px;
}
.item-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:10px;margin-bottom:24px;
}
/* ITEM CARD — McDonald's style: photo top, info bottom */
.item-card{
  background:var(--surface);border-radius:var(--r2);
  overflow:hidden;box-shadow:var(--sh);
  display:flex;flex-direction:column;
  cursor:pointer;transition:transform .18s,box-shadow .18s;
  border:2px solid transparent;
  position:relative;
}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--brand)}
.item-card.unavailable{opacity:.5;pointer-events:none}
.item-card-img{
  width:100%;aspect-ratio:1;
  background:linear-gradient(135deg,#f5f0e8,#ede8df);
  display:flex;align-items:center;justify-content:center;
  font-size:3rem;overflow:hidden;position:relative;
}
.item-card-img img{width:100%;height:100%;object-fit:cover}
.item-card-sold{
  position:absolute;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:900;color:#fff;letter-spacing:.06em;
}
.item-card-body{padding:8px 10px 10px}
.item-card-name{font-size:.85rem;font-weight:800;color:var(--text);line-height:1.3;margin-bottom:2px}
.item-card-jp{font-size:.73rem;color:var(--text3);margin-bottom:4px}
.item-card-price{font-family:'Fredoka',sans-serif;font-size:1.05rem;font-weight:700;color:var(--brand)}
.item-card-add{
  position:absolute;bottom:8px;right:8px;
  width:28px;height:28px;border-radius:50%;
  background:var(--brand);color:#fff;
  font-size:1.1rem;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(232,57,14,.4);
  transition:transform .12s;
}
.item-card:hover .item-card-add{transform:scale(1.15)}

/* ── BOTTOM ORDER BAR ── */
.order-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--brand);color:#fff;
  padding:12px 16px;
  display:none;align-items:center;gap:12px;
  z-index:200;
  box-shadow:0 -4px 20px rgba(232,57,14,.35);
  cursor:pointer;transition:background .15s;
}
.order-bar.visible{display:flex}
.order-bar:hover{background:var(--brand2)}
.ob-cnt{
  background:rgba(255,255,255,.25);border-radius:99px;
  min-width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:900;padding:0 6px;
}
.ob-label{font-size:.95rem;font-weight:800;flex:1}
.ob-total{font-family:'Fredoka',sans-serif;font-size:1.2rem;font-weight:700}
.ob-arrow{font-size:1.1rem;opacity:.8}

/* ── ITEM DETAIL MODAL ── */
.detail-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:500;display:none;align-items:flex-end;justify-content:center;
}
.detail-bg.open{display:flex}
.detail-sheet{
  background:var(--surface);
  width:100%;max-width:540px;
  border-radius:var(--r3) var(--r3) 0 0;
  max-height:92dvh;overflow-y:auto;
  animation:sheetUp .28s cubic-bezier(.25,.8,.25,1);
  scrollbar-width:none;
}
.detail-sheet::-webkit-scrollbar{display:none}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.detail-img{
  width:100%;aspect-ratio:16/9;
  background:linear-gradient(135deg,#f5f0e8,#ede8df);
  display:flex;align-items:center;justify-content:center;
  font-size:5rem;overflow:hidden;position:relative;
}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-close{
  position:absolute;top:12px;right:12px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.45);color:#fff;
  font-size:1rem;display:flex;align-items:center;justify-content:center;
  transition:background .15s;
}
.detail-close:hover{background:rgba(0,0,0,.7)}
.detail-body{padding:20px 20px 0}
.detail-name{font-family:'Fredoka',sans-serif;font-size:1.6rem;font-weight:600;color:var(--text);line-height:1.2;margin-bottom:2px}
.detail-jp{font-size:.9rem;color:var(--text3);margin-bottom:8px}
.detail-desc{font-size:.88rem;color:var(--text2);line-height:1.6;margin-bottom:16px}
.detail-price{font-family:'Fredoka',sans-serif;font-size:1.5rem;font-weight:700;color:var(--brand);margin-bottom:20px}

/* Set upsell section inside detail modal */
.set-upsell-section{
  background:#fffbf0;border:2px solid var(--mustard);
  border-radius:var(--r2);padding:16px;margin-bottom:16px;
}
.set-upsell-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.set-upsell-icon{font-size:1.4rem}
.set-upsell-title{font-size:.95rem;font-weight:900;color:var(--text)}
.set-upsell-sub{font-size:.78rem;color:var(--text2)}
.set-toggle{
  margin-left:auto;position:relative;
  width:46px;height:26px;
}
.set-toggle input{opacity:0;width:0;height:0}
.set-toggle-slider{
  position:absolute;inset:0;background:#ccc;border-radius:99px;
  cursor:pointer;transition:background .2s;
}
.set-toggle-slider::before{
  content:'';position:absolute;
  width:20px;height:20px;border-radius:50%;background:#fff;
  left:3px;top:3px;transition:transform .2s;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.set-toggle input:checked + .set-toggle-slider{background:var(--mustard)}
.set-toggle input:checked + .set-toggle-slider::before{transform:translateX(20px)}

.set-choices{display:none;flex-direction:column;gap:14px}
.set-choices.open{display:flex}
.choice-group-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.choice-options{display:flex;flex-direction:column;gap:6px}
.choice-opt{
  display:flex;align-items:center;gap:12px;
  background:#fff;border:2px solid var(--border);
  border-radius:var(--r);padding:10px 12px;
  cursor:pointer;transition:all .15s;
}
.choice-opt:hover{border-color:var(--mustard);background:#fffdf5}
.choice-opt.picked{border-color:var(--mustard);background:#fffbe6}
.choice-opt-img{
  width:40px;height:40px;border-radius:8px;
  background:#f5f0e8;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.2rem;
}
.choice-opt-img img{width:100%;height:100%;object-fit:cover}
.choice-opt-name{font-size:.85rem;font-weight:700;color:var(--text);flex:1}
.choice-opt-jp{font-size:.72rem;color:var(--text3)}
.choice-radio{
  width:20px;height:20px;border-radius:50%;
  border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.choice-opt.picked .choice-radio{border-color:var(--mustard);background:var(--mustard)}
.choice-opt.picked .choice-radio::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;display:block}

.set-price-tag{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:10px;padding-top:10px;border-top:1px solid #f0e8cc;
  font-size:.82rem;color:var(--text2);
}
.set-price-tag .sp{font-family:'Fredoka',sans-serif;font-size:1rem;font-weight:700;color:var(--mustard)}

/* Multi-set selector */
.set-upsell-hd-plain{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.set-sections{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}

/* One set option row */
.set-section{
  border:2px solid var(--border);border-radius:var(--r);
  overflow:hidden;transition:border-color .15s;
}
.set-section.active{border-color:var(--mustard)}

.set-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;cursor:pointer;
  background:#fff;transition:background .12s;
}
.set-row:hover{background:#fffdf5}
.set-row.picked{background:#fffbe6}

.set-row-radio{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.set-row.picked .set-row-radio{border-color:var(--mustard);background:var(--mustard)}
.set-row-dot{
  width:9px;height:9px;border-radius:50%;background:#fff;
  display:none;
}
.set-row.picked .set-row-dot{display:block}

.set-row-info{flex:1;min-width:0}
.set-row-name{font-size:.9rem;font-weight:800;color:var(--text);line-height:1.2}
.set-row-desc{font-size:.75rem;color:var(--text3);margin-top:1px}
.set-row-price{font-family:'Fredoka',sans-serif;font-size:1rem;font-weight:700;color:var(--mustard);flex-shrink:0}

/* Expandable choice area inside each set */
.set-choices-inner{
  display:none;flex-direction:column;gap:10px;
  padding:12px 14px;background:#fffbf2;
  border-top:1px solid #f0e8cc;
}
.set-choices-inner.open{display:flex}

/* Skip button */
.set-skip-btn{
  width:100%;padding:10px;margin-top:6px;
  border:1.5px dashed var(--border);border-radius:var(--r);
  font-size:.82rem;font-weight:700;color:var(--text3);
  background:none;cursor:pointer;transition:all .15s;
  text-align:center;
}
.set-skip-btn:hover{border-color:var(--text3);color:var(--text2);background:#faf8f4}
.set-skip-btn.active{border-color:var(--text);color:var(--text);background:#f5f2ec}

/* Qty + Add button at bottom of detail */
.detail-footer{
  display:flex;align-items:center;gap:12px;
  padding:16px 20px 24px;
  position:sticky;bottom:0;
  background:var(--surface);border-top:1px solid var(--border);
}
.qty-ctrl{
  display:flex;align-items:center;
  background:#f5f2ec;border-radius:var(--r);overflow:hidden;
}
.qty-ctrl button{
  width:40px;height:44px;font-size:1.2rem;font-weight:900;
  color:var(--brand);transition:background .12s;
}
.qty-ctrl button:hover{background:#ede8df}
.qty-ctrl span{
  width:40px;text-align:center;font-size:1.05rem;font-weight:900;color:var(--text)
}
.detail-add-btn{
  flex:1;background:var(--brand);color:#fff;
  border-radius:var(--r);padding:13px;
  font-size:1rem;font-weight:900;font-family:'Fredoka',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 14px rgba(232,57,14,.4);
  transition:all .15s;
}
.detail-add-btn:hover:not(:disabled){background:var(--brand2);transform:translateY(-1px)}
.detail-add-btn:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;transform:none}

/* ── CART DRAWER ── */
.cart-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:600;display:none;justify-content:flex-end;
}
.cart-bg.open{display:flex}
.cart-panel{
  background:var(--bg);width:min(400px,100vw);height:100dvh;
  display:flex;flex-direction:column;
  animation:slideR .26s cubic-bezier(.25,.8,.25,1);
  box-shadow:-8px 0 32px rgba(0,0,0,.2);
}
@keyframes slideR{from{transform:translateX(100%)}to{transform:translateX(0)}}
.cart-hd{
  background:var(--navy);color:#fff;
  padding:0 16px;height:56px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.cart-hd-title{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;color:var(--mustard)}
.cart-hd-table{font-size:.78rem;color:rgba(255,255,255,.6)}
.close-btn{
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.1);color:#fff;
  font-size:.9rem;display:flex;align-items:center;justify-content:center;
}
.close-btn:hover{background:rgba(255,255,255,.2)}
.cart-items-wrap{flex:1;overflow-y:auto;padding:12px}
/* Each cart item — receipt row style */
.cart-item{
  background:var(--surface);border-radius:var(--r);
  padding:12px;margin-bottom:8px;
  display:flex;align-items:flex-start;gap:10px;
  box-shadow:var(--sh);
}
.ci-thumb{
  width:52px;height:52px;border-radius:8px;flex-shrink:0;
  background:#f0ece4;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:1.5rem;
}
.ci-thumb img{width:100%;height:100%;object-fit:cover}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:.88rem;font-weight:800;color:var(--text);margin-bottom:2px}
.ci-jp{font-size:.73rem;color:var(--text3)}
.ci-set-tag{
  display:inline-block;margin-top:4px;margin-bottom:3px;
  background:#fff7dc;border:1px solid #f5c100;border-radius:99px;
  padding:1px 8px;font-size:.68rem;font-weight:800;color:#a07800;
}
.ci-set-choices{font-size:.72rem;color:var(--text3);line-height:1.6}
.ci-price{font-size:.78rem;color:var(--text3);margin-top:3px}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.ci-sub{font-family:'Fredoka',sans-serif;font-size:1rem;font-weight:700;color:var(--brand)}
.ci-qty-row{display:flex;align-items:center;gap:4px}
.ci-qb{
  width:24px;height:24px;border-radius:50%;
  background:#f0ece4;font-size:.85rem;font-weight:900;color:var(--text);
  display:flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.ci-qb:hover{background:var(--mustard)}
.ci-qnum{width:20px;text-align:center;font-size:.85rem;font-weight:900}
.ci-rm{color:#ccc;font-size:.8rem;padding:2px 4px;border-radius:4px}
.ci-rm:hover{background:#ffe5e2;color:var(--brand)}

.cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px;text-align:center;color:var(--text3)}
.cart-empty-icon{font-size:4rem;opacity:.4}
.cart-empty h3{font-size:1rem;font-weight:800;color:var(--text2)}

/* Cart summary */
.cart-summary{
  background:var(--surface);border-top:2px solid var(--border);
  padding:14px 16px;flex-shrink:0;
}
.summary-row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.summary-row.total{font-size:1.1rem;font-weight:900;color:var(--text);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.summary-row .amt{font-family:'Fredoka',sans-serif;font-weight:700}

.cart-notes-area{padding:0 16px 12px}
.notes-lbl{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);display:block;margin-bottom:5px}
.notes-ta{
  width:100%;padding:9px 11px;border:1.5px solid var(--border);
  border-radius:var(--r);background:var(--surface);
  color:var(--text);font-size:.85rem;font-family:'Nunito',sans-serif;
  resize:none;height:50px;transition:border-color .15s;
}
.notes-ta:focus{outline:none;border-color:var(--brand)}

.place-btn{
  margin:0 16px 20px;
  background:var(--brand);color:#fff;
  border-radius:var(--r);padding:15px;
  font-size:1.05rem;font-weight:900;font-family:'Fredoka',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(232,57,14,.4);transition:all .15s;
}
.place-btn:hover:not(:disabled){background:var(--brand2);transform:translateY(-1px)}
.place-btn:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;transform:none}

/* Success */
.success-screen{display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:50px 28px;text-align:center;flex:1}
.success-screen.show{display:flex}
.s-icon{width:80px;height:80px;background:#e6f9f3;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.6rem;animation:pop .4s cubic-bezier(.175,.885,.32,1.275)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.s-num{background:var(--navy);color:var(--mustard);font-family:'Fredoka',sans-serif;font-size:1.5rem;font-weight:700;padding:10px 24px;border-radius:var(--r)}
.s-title{font-family:'Fredoka',sans-serif;font-size:1.5rem;font-weight:700;color:var(--text)}
.s-msg{color:var(--text2);font-size:.88rem;line-height:1.6;max-width:240px}
.s-track{background:var(--navy);color:var(--mustard);border-radius:var(--r);padding:12px 24px;font-weight:900;font-family:'Fredoka',sans-serif;font-size:.95rem;transition:all .15s}
.s-track:hover{transform:translateY(-1px)}
.s-more{color:var(--text3);font-size:.85rem;font-weight:700;padding:8px;transition:color .15s}
.s-more:hover{color:var(--text)}

/* ── MY ORDERS PANEL ── */
.os-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;display:none;justify-content:flex-end}
.os-bg.open{display:flex}
.os-panel{background:var(--bg);width:min(400px,100vw);height:100dvh;display:flex;flex-direction:column;animation:slideR .26s cubic-bezier(.25,.8,.25,1)}
.os-hd{background:var(--navy);color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.os-hd-title{font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;color:var(--mustard)}
.os-body{flex:1;overflow-y:auto;padding:12px}
.order-card{background:var(--surface);border-radius:var(--r2);padding:14px;margin-bottom:10px;box-shadow:var(--sh);border-left:4px solid var(--border)}
.order-card.pending  {border-left-color:#f5c100}
.order-card.preparing{border-left-color:#00B69B}
.order-card.ready    {border-left-color:#22c55e}
.order-card.done     {border-left-color:#ccc}
.oc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.oc-num{font-family:'Fredoka',sans-serif;font-size:1.05rem;font-weight:700;color:var(--navy)}
.oc-time{font-size:.72rem;color:var(--text3)}
.oc-status{padding:4px 10px;border-radius:99px;font-size:.7rem;font-weight:800;text-transform:capitalize}
.oc-status.pending  {background:rgba(245,193,0,.15);color:#a07800}
.oc-status.preparing{background:rgba(0,182,155,.15);color:#007a69}
.oc-status.ready    {background:rgba(34,197,94,.15);color:#15803d}
.oc-status.done     {background:#f5f5f5;color:#999}

/* Status progress bar */
.oc-progress{display:flex;align-items:center;margin-bottom:12px;gap:0}
.prog-step{display:flex;flex-direction:column;align-items:center;flex:1}
.prog-dot{width:20px;height:20px;border-radius:50%;background:#e8e4dc;display:flex;align-items:center;justify-content:center;font-size:.55rem;font-weight:900;color:#aaa;transition:all .3s}
.prog-dot.done{background:#22c55e;color:#fff}
.prog-dot.active{background:var(--mustard);color:var(--navy);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,193,0,.4)}50%{box-shadow:0 0 0 5px rgba(245,193,0,0)}}
.prog-lbl{font-size:.55rem;font-weight:700;color:var(--text3);margin-top:3px;text-align:center}
.prog-line{flex:1;height:2px;background:#e8e4dc;margin-bottom:14px}
.prog-line.done{background:#22c55e}

.oc-items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.oc-item{display:flex;align-items:center;gap:8px}
.oc-thumb{width:32px;height:32px;border-radius:6px;background:#f0ece4;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.oc-thumb img{width:100%;height:100%;object-fit:cover}
.oc-item-name{font-size:.82rem;font-weight:700;color:var(--text);flex:1}
.oc-item-sides{font-size:.7rem;color:var(--text3)}
.oc-item-qty{font-size:.78rem;color:var(--text3)}
.oc-total{display:flex;justify-content:space-between;font-weight:900;font-size:.9rem;color:var(--text);border-top:1px dashed var(--border);padding-top:8px}
.oc-total .ta{font-family:'Fredoka',sans-serif;color:var(--brand)}
.ready-notice{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 12px;font-size:.8rem;font-weight:700;color:#15803d;text-align:center;margin-top:8px}
.os-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px 20px;color:var(--text3);text-align:center}
.os-empty-icon{font-size:3rem;opacity:.4}

/* ── LOADER / SPIN ── */
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-grid{display:flex;align-items:center;justify-content:center;padding:60px;width:100%}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .cat-rail{width:82px}
  .cat-icon{font-size:1.3rem}
  .item-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .item-card-body{padding:6px 8px 8px}
  .item-card-name{font-size:.78rem}
  .item-card-price{font-size:.92rem}
}
</style>
</head>
<body>

<!-- TABLE GATE -->
<div id="gate">
  <div class="gate-inner">
    <span class="gate-logo" id="gate-emoji">🎪</span>
    <div class="gate-shop-name" id="gate-name">Festival Shop</div>
    <div class="gate-tagline" id="gate-tag">School Festival 2025</div>
    <div class="gate-card">
      <label class="gate-lbl" for="gate-in">Table Number</label>
      <input class="gate-in" id="gate-in" type="text" placeholder="e.g.  3" maxlength="10" autocomplete="off"/>
      <button class="gate-btn" id="gate-btn">Start Ordering</button>
      <div class="gate-err" id="gate-err"></div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- Header -->
  <header class="app-hdr">
    <span class="hdr-logo" id="hdr-emoji">🎪</span>
    <span class="hdr-name" id="hdr-name">Festival Shop</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <span class="hdr-table">Table <span id="table-display"></span></span>
      <button class="hdr-orders-btn" id="my-orders-btn">
        📋 My Orders
        <span class="hdr-dot" id="ready-dot"></span>
      </button>
    </div>
  </header>

  <!-- Body: sidebar + grid -->
  <div class="app-body">
    <!-- Category sidebar -->
    <nav class="cat-rail" id="cat-rail"></nav>
    <!-- Item grid -->
    <div class="item-grid-wrap" id="item-grid-wrap">
      <div class="loading-grid"><div class="spin"></div></div>
    </div>
  </div>
</div>

<!-- ORDER BAR -->
<div class="order-bar" id="order-bar">
  <span class="ob-cnt" id="ob-cnt">0</span>
  <span class="ob-label">View Order</span>
  <span class="ob-total" id="ob-total"></span>
  <span class="ob-arrow">›</span>
</div>

<!-- ITEM DETAIL SHEET -->
<div class="detail-bg" id="detail-bg">
  <div class="detail-sheet" id="detail-sheet">
    <div class="detail-img" id="detail-img">
      <button class="detail-close" id="detail-close">✕</button>
    </div>
    <div class="detail-body">
      <div class="detail-name" id="detail-name"></div>
      <div class="detail-jp"   id="detail-jp"></div>
      <div class="detail-desc" id="detail-desc"></div>
      <div class="detail-price" id="detail-price"></div>
      <!-- Set upsell injected here -->
      <div id="detail-set-area"></div>
    </div>
    <div class="detail-footer">
      <div class="qty-ctrl">
        <button id="d-qty-dec">−</button>
        <span   id="d-qty-num">1</span>
        <button id="d-qty-inc">+</button>
      </div>
      <button class="detail-add-btn" id="d-add-btn">Add to Order</button>
    </div>
  </div>
</div>

<!-- CART DRAWER -->
<div class="cart-bg" id="cart-bg">
  <div class="cart-panel">
    <div class="cart-hd">
      <div>
        <div class="cart-hd-title">Your Order</div>
        <div class="cart-hd-table">Table <span id="cart-table"></span></div>
      </div>
      <button class="close-btn" id="cart-close">✕</button>
    </div>

    <div class="success-screen" id="success-screen">
      <div class="s-icon">✅</div>
      <div class="s-title">Order Sent!</div>
      <div class="s-num"  id="s-num">#0001</div>
      <div class="s-msg">We'll call your table when it's ready!</div>
      <button class="s-track" id="s-track">📋 Track Order</button>
      <button class="s-more"  id="s-more">+ Order More</button>
    </div>

    <div id="cart-main-area" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="cart-items-wrap" id="cart-items-wrap"></div>
      <div class="cart-notes-area">
        <label class="notes-lbl">Special Notes</label>
        <textarea class="notes-ta" id="f-notes" placeholder="Allergies, no spicy, extra sauce…" maxlength="200"></textarea>
      </div>
      <div class="cart-summary" id="cart-summary"></div>
      <button class="place-btn" id="place-btn" disabled>Place Order</button>
    </div>
  </div>
</div>

<!-- MY ORDERS PANEL -->
<div class="os-bg" id="os-bg">
  <div class="os-panel">
    <div class="os-hd">
      <span class="os-hd-title">My Orders — Table <span id="os-table"></span></span>
      <button class="close-btn" id="os-close">✕</button>
    </div>
    <div class="os-body" id="os-body"></div>
  </div>
</div>

<div id="toast-area"></div>

<script type="module">
import { sb, getSettings, fmt, esc, toast, padNum } from './supabase-config.js';

var settings   = {};
var categories = [];
var items      = [];
var setMenus   = [];
var setGroups  = {};   // setId -> [{group_name, category_id, cat_name}]
var cart       = [];
var tableNum   = '';
var nextCartId = 1;
var activeCat  = 'all';

// detail modal state
var dItem       = null;   // item being viewed
var dAllSets    = [];     // all available set menus [{setItem, groups}]
var dPickedSet  = null;   // which set the customer chose (null = none)
var dChoices    = {};     // group_name -> {id,name,emoji,image}
var dQty        = 1;

// ── Boot ──────────────────────────────────────────────────
(async function() {
  settings = await getSettings();
  applyBranding();
})();

function applyBranding() {
  var name  = settings.shop_name || 'Festival Shop';
  var emoji = settings.emoji || '🎪';
  var tag   = settings.tagline || '';
  var setEl = function(id, val) { var e = document.getElementById(id); if(e) e.textContent = val; };
  setEl('gate-emoji', emoji); setEl('hdr-emoji', emoji);
  setEl('gate-name',  name);  setEl('hdr-name',  name);
  setEl('gate-tag',   tag);
  document.title = name;
}

// ── Gate ──────────────────────────────────────────────────
document.getElementById('gate-in').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('gate-btn').click();
});
document.getElementById('gate-btn').addEventListener('click', function() {
  var val = document.getElementById('gate-in').value.trim();
  if (!val) { document.getElementById('gate-err').textContent = 'Please enter your table number.'; return; }
  tableNum = val;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('table-display').textContent = tableNum;
  document.getElementById('cart-table').textContent    = tableNum;
  document.getElementById('os-table').textContent      = tableNum;
  loadMenu();
  startPoll();
});

// ── Load menu ─────────────────────────────────────────────
async function loadMenu() {
  var r1 = await sb.from('categories').select('*').order('sort_order');
  var r2 = await sb.from('menu_items').select('*').order('created_at');
  var r3 = await sb.from('set_components')
    .select('set_id, component_group, component_category_id, sort_order, cat:component_category_id(id,name)')
    .order('sort_order');

  categories = r1.data || [];
  var allItems = r2.data || [];
  items    = allItems.filter(function(i) { return !i.is_set; });
  setMenus = allItems.filter(function(i) { return  i.is_set; });

  setGroups = {};
  (r3.data || []).forEach(function(sc) {
    if (!sc.component_group || !sc.component_category_id) return;
    if (!setGroups[sc.set_id]) setGroups[sc.set_id] = [];
    setGroups[sc.set_id].push({
      group_name:  sc.component_group,
      category_id: sc.component_category_id,
      cat_name:    sc.cat ? sc.cat.name : '',
    });
  });

  renderSidebar();
  renderGrid('all');
}

// ── Category sidebar ──────────────────────────────────────
function renderSidebar() {
  var rail = document.getElementById('cat-rail');
  var html = '<button class="cat-btn active" data-cat="all"><span class="cat-icon">🍽</span>All</button>';
  categories.forEach(function(c) {
    if (!items.some(function(i) { return i.category_id === c.id; })) return;
    html += '<button class="cat-btn" data-cat="' + c.id + '"><span class="cat-icon">' + esc(getEmoji(c.name)) + '</span>' + esc(stripEmoji(c.name)) + '</button>';
  });
  rail.innerHTML = html;
  rail.querySelectorAll('.cat-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      rail.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      renderGrid(activeCat);
    });
  });
}

function getEmoji(name) {
  var m = name.match(/^\p{Emoji}/u);
  return m ? m[0] : '🍽';
}
function stripEmoji(name) {
  return name.replace(/^\p{Emoji}\s*/u, '');
}

// ── Item grid ─────────────────────────────────────────────
function renderGrid(catId) {
  var wrap = document.getElementById('item-grid-wrap');
  var sym  = settings.currency || '¥';
  var list = catId === 'all' ? items : items.filter(function(i) { return i.category_id === catId; });

  if (!list.length) {
    wrap.innerHTML = '<div class="loading-grid" style="flex-direction:column;gap:10px;color:var(--text3)"><span style="font-size:3rem;opacity:.3">🍽</span><span style="font-weight:700;opacity:.4">No items here</span></div>';
    return;
  }

  // Group by category when showing all
  var html = '';
  if (catId === 'all') {
    categories.forEach(function(c) {
      var catItems = list.filter(function(i) { return i.category_id === c.id; });
      if (!catItems.length) return;
      html += '<div class="section-title">' + esc(c.name) + '</div>';
      html += '<div class="item-grid">' + catItems.map(buildCard).join('') + '</div>';
    });
    // Uncategorized
    var uncat = list.filter(function(i) { return !i.category_id; });
    if (uncat.length) {
      html += '<div class="section-title">Other</div>';
      html += '<div class="item-grid">' + uncat.map(buildCard).join('') + '</div>';
    }
  } else {
    html = '<div class="item-grid">' + list.map(buildCard).join('') + '</div>';
  }

  wrap.innerHTML = html;
  wrap.querySelectorAll('.item-card:not(.unavailable)').forEach(function(card) {
    card.addEventListener('click', function() { openDetail(card.dataset.id); });
  });
}

function buildCard(it) {
  var sym = settings.currency || '¥';
  var imgEl = it.image_url
    ? '<img src="' + esc(it.image_url) + '" alt="' + esc(it.name) + '" loading="lazy"/>'
    : '<span>' + esc(it.emoji || '🍽') + '</span>';
  return '<div class="item-card' + (it.available ? '' : ' unavailable') + '" data-id="' + it.id + '">'
    + '<div class="item-card-img">' + imgEl + (!it.available ? '<div class="item-card-sold">SOLD OUT</div>' : '') + '</div>'
    + '<div class="item-card-body">'
    + '<div class="item-card-name">' + esc(it.name) + '</div>'
    + (it.name_jp ? '<div class="item-card-jp">' + esc(it.name_jp) + '</div>' : '')
    + '<div class="item-card-price">' + fmt(it.price, sym) + '</div>'
    + '</div>'
    + (it.available ? '<div class="item-card-add">+</div>' : '')
    + '</div>';
}

// ── Detail modal ──────────────────────────────────────────
async function openDetail(itemId) {
  dItem      = items.find(function(x) { return x.id === itemId; });
  dAllSets   = [];
  dPickedSet = null;
  dChoices   = {};
  dQty       = 1;
  if (!dItem) return;

  var sym = settings.currency || '¥';

  // Populate header image
  var imgEl = document.getElementById('detail-img');
  imgEl.innerHTML = '<button class="detail-close" id="detail-close">✕</button>';
  if (dItem.image_url) {
    var img = document.createElement('img');
    img.src = dItem.image_url; img.alt = dItem.name;
    imgEl.insertBefore(img, imgEl.firstChild);
  } else {
    var em = document.createElement('span');
    em.textContent = dItem.emoji || '🍽';
    imgEl.insertBefore(em, imgEl.firstChild);
  }
  document.getElementById('detail-close').onclick = closeDetail;

  document.getElementById('detail-name').textContent  = dItem.name;
  document.getElementById('detail-jp').textContent    = dItem.name_jp || '';
  document.getElementById('detail-jp').style.display  = dItem.name_jp ? 'block' : 'none';
  document.getElementById('detail-desc').textContent  = dItem.description || '';
  document.getElementById('detail-desc').style.display = dItem.description ? 'block' : 'none';
  document.getElementById('detail-price').textContent = fmt(dItem.price, sym);
  document.getElementById('d-qty-num').textContent    = '1';

  // Collect ALL available sets that have groups configured
  dAllSets = setMenus.filter(function(s) {
    return s.available && setGroups[s.id] && setGroups[s.id].length > 0;
  });
  dPickedSet = null;
  dChoices   = {};

  var setArea = document.getElementById('detail-set-area');

  if (!dAllSets.length) {
    setArea.innerHTML = '';
  } else {
    // Gather all unique category IDs needed across every set
    var allCatIds = [];
    dAllSets.forEach(function(s) {
      setGroups[s.id].forEach(function(g) {
        if (allCatIds.indexOf(g.category_id) === -1) allCatIds.push(g.category_id);
      });
    });

    setArea.innerHTML = '<div class="loading-grid" style="padding:16px 0"><div class="spin"></div></div>';

    // Load choice items once for all sets
    var res = await sb.from('menu_items').select('*')
      .in('category_id', allCatIds).eq('available', true).eq('is_set', false);
    var allChoiceItems = res.data || [];

    // Build UI: one collapsible section per set, radio to select which set
    var sectionsHtml = dAllSets.map(function(setItem, si) {
      var groups = setGroups[setItem.id];
      var groupsHtml = groups.map(function(g) {
        var opts = allChoiceItems.filter(function(i) { return i.category_id === g.category_id; });
        var optsHtml = opts.map(function(opt) {
          var oi = opt.image_url
            ? '<img src="' + esc(opt.image_url) + '" loading="lazy"/>'
            : (opt.emoji || '🍽');
          return '<div class="choice-opt"'
            + ' data-setidx="' + si + '"'
            + ' data-group="' + esc(g.group_name) + '"'
            + ' data-id="' + opt.id + '"'
            + ' data-name="' + esc(opt.name_jp || opt.name) + '"'
            + ' data-emoji="' + esc(opt.emoji || '🍽') + '"'
            + ' data-image="' + esc(opt.image_url || '') + '">'
            + '<div class="choice-opt-img">' + oi + '</div>'
            + '<div class="choice-opt-name">' + esc(opt.name_jp || opt.name)
            + (opt.name && opt.name_jp ? '<div class="choice-opt-jp">' + esc(opt.name) + '</div>' : '')
            + '</div>'
            + '<div class="choice-radio"></div>'
            + '</div>';
        }).join('');
        return '<div class="choice-group-label">' + esc(g.group_name)
          + ' <span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--text3)">— choose one</span></div>'
          + '<div class="choice-options">' + optsHtml + '</div>';
      }).join('');

      return '<div class="set-section" data-setidx="' + si + '">'
        // Row: radio + set info + price
        + '<div class="set-row" data-setidx="' + si + '">'
        + '<div class="set-row-radio"><div class="set-row-dot"></div></div>'
        + '<div class="set-row-info">'
        + '<div class="set-row-name">' + esc(setItem.name_jp || setItem.name) + '</div>'
        + '<div class="set-row-desc">' + esc(setItem.description || '') + '</div>'
        + '</div>'
        + '<div class="set-row-price">+' + fmt(setItem.price, sym) + '</div>'
        + '</div>'
        // Collapsible choice area (hidden until this set is selected)
        + '<div class="set-choices-inner" id="set-inner-' + si + '">' + groupsHtml + '</div>'
        + '</div>';
    }).join('');

    setArea.innerHTML = '<div class="set-upsell-section">'
      + '<div class="set-upsell-hd-plain">'
      + '<span class="set-upsell-icon">🍱</span>'
      + '<div><div class="set-upsell-title">Add a Set?</div>'
      + '<div class="set-upsell-sub">Choose one — or skip</div></div>'
      + '</div>'
      + '<div class="set-sections">' + sectionsHtml + '</div>'
      + '<button class="set-skip-btn" id="set-skip-btn">No set — just the main dish</button>'
      + '</div>';

    // Wire set-row clicks (selecting a set)
    setArea.querySelectorAll('.set-row').forEach(function(row) {
      row.addEventListener('click', function() {
        var si = parseInt(row.dataset.setidx);
        selectSet(si, setArea);
      });
    });

    // Wire skip
    document.getElementById('set-skip-btn').addEventListener('click', function() {
      deselectSet(setArea);
    });

    // Wire choice option clicks
    setArea.querySelectorAll('.choice-opt').forEach(function(opt) {
      opt.addEventListener('click', function() {
        var si = parseInt(opt.dataset.setidx);
        var g  = opt.dataset.group;
        // Only allow picking if this set is currently selected
        if (!dPickedSet || dPickedSet.idx !== si) {
          selectSet(si, setArea);
        }
        setArea.querySelectorAll('.choice-opt[data-setidx="' + si + '"][data-group="' + g + '"]')
          .forEach(function(o) { o.classList.remove('picked'); });
        opt.classList.add('picked');
        dChoices[g] = { id: opt.dataset.id, name: opt.dataset.name, emoji: opt.dataset.emoji, image: opt.dataset.image };
        refreshDetailBtn();
      });
    });
  }

  refreshDetailBtn();
  document.getElementById('detail-bg').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-bg').classList.remove('open');
  dItem = null; dAllSets = []; dPickedSet = null; dChoices = {}; dQty = 1;
}

function selectSet(si, setArea) {
  dPickedSet = { idx: si, setItem: dAllSets[si] };
  dChoices   = {};
  // Update radio dots
  setArea.querySelectorAll('.set-row').forEach(function(r) {
    r.classList.toggle('picked', parseInt(r.dataset.setidx) === si);
  });
  // Show/hide choice areas
  setArea.querySelectorAll('.set-choices-inner').forEach(function(inner, i) {
    inner.classList.toggle('open', i === si);
  });
  // Clear picked choices in all options
  setArea.querySelectorAll('.choice-opt').forEach(function(o) { o.classList.remove('picked'); });
  // Update skip button style
  var skipBtn = document.getElementById('set-skip-btn');
  if (skipBtn) skipBtn.classList.remove('active');
  setArea.querySelectorAll('.set-section').forEach(function(s, i) {
    s.classList.toggle('active', i === si);
  });
  refreshDetailBtn();
}

function deselectSet(setArea) {
  dPickedSet = null;
  dChoices   = {};
  setArea.querySelectorAll('.set-row').forEach(function(r) { r.classList.remove('picked'); });
  setArea.querySelectorAll('.set-choices-inner').forEach(function(inner) { inner.classList.remove('open'); });
  setArea.querySelectorAll('.choice-opt').forEach(function(o) { o.classList.remove('picked'); });
  setArea.querySelectorAll('.set-section').forEach(function(s) { s.classList.remove('active'); });
  var skipBtn = document.getElementById('set-skip-btn');
  if (skipBtn) skipBtn.classList.add('active');
  refreshDetailBtn();
}

function refreshDetailBtn() {
  var btn = document.getElementById('d-add-btn');
  var sym = settings.currency || '¥';

  if (!dPickedSet) {
    // No set chosen — just add main item
    btn.disabled    = false;
    btn.textContent = 'Add to Order — ' + fmt((dItem ? parseFloat(dItem.price) : 0) * dQty, sym);
    return;
  }

  // Set chosen — check all groups have a choice
  var groups  = setGroups[dPickedSet.setItem.id] || [];
  var missing = groups.filter(function(g) { return !dChoices[g.group_name]; });
  var total   = (dItem ? parseFloat(dItem.price) : 0) + parseFloat(dPickedSet.setItem.price);

  btn.disabled = missing.length > 0;
  btn.textContent = missing.length > 0
    ? 'Choose your ' + missing[0].group_name
    : 'Add to Order — ' + fmt(total * dQty, sym);
}

// Qty buttons in detail
document.getElementById('d-qty-dec').addEventListener('click', function() {
  dQty = Math.max(1, dQty - 1);
  document.getElementById('d-qty-num').textContent = dQty;
  refreshDetailBtn();
});
document.getElementById('d-qty-inc').addEventListener('click', function() {
  dQty = Math.min(20, dQty + 1);
  document.getElementById('d-qty-num').textContent = dQty;
  refreshDetailBtn();
});

document.getElementById('d-add-btn').addEventListener('click', function() {
  if (!dItem) return;
  var hasSet  = dPickedSet !== null;
  var setItem = hasSet ? dPickedSet.setItem : null;
  cart.push({
    cartId:    nextCartId++,
    id:        dItem.id,
    name:      dItem.name,
    name_jp:   dItem.name_jp || '',
    emoji:     dItem.emoji || '🍽',
    image_url: dItem.image_url || '',
    mainPrice: parseFloat(dItem.price),
    price:     parseFloat(dItem.price) + (setItem ? parseFloat(setItem.price) : 0),
    qty:       dQty,
    set:       setItem ? { id: setItem.id, name: setItem.name, name_jp: setItem.name_jp || '', price: parseFloat(setItem.price) } : null,
    choices:   hasSet ? Object.assign({}, dChoices) : {},
  });
  closeDetail();
  refreshBadge();
  renderCart();
  toast(hasSet ? 'Set added! 🍱' : 'Added to order! 🛒', 'success');
});

document.getElementById('detail-bg').addEventListener('click', function(e) {
  if (e.target === document.getElementById('detail-bg')) closeDetail();
});

// ── Cart ──────────────────────────────────────────────────
function cartTotal() {
  var sub = cart.reduce(function(s, e) { return s + e.price * e.qty; }, 0);
  var tax = sub * (parseFloat(settings.tax || 0) / 100);
  return { sub: sub, tax: tax, total: sub + tax };
}

function refreshBadge() {
  var n   = cart.reduce(function(s, e) { return s + e.qty; }, 0);
  var sym = settings.currency || '¥';
  var bar = document.getElementById('order-bar');
  document.getElementById('ob-cnt').textContent   = n;
  document.getElementById('ob-total').textContent = fmt(Math.round(cartTotal().total), sym);
  if (n > 0) bar.classList.add('visible'); else bar.classList.remove('visible');
}

function renderCart() {
  var wrap    = document.getElementById('cart-items-wrap');
  var summary = document.getElementById('cart-summary');
  var placeEl = document.getElementById('place-btn');
  var sym     = settings.currency || '¥';

  if (!cart.length) {
    wrap.innerHTML = '<div class="cart-empty"><div class="cart-empty-icon">🛒</div><h3>Your cart is empty</h3><p style="font-size:.82rem;color:var(--text3)">Tap any item to add it</p></div>';
    summary.innerHTML = '';
    placeEl.disabled = true;
    return;
  }

  wrap.innerHTML = cart.map(function(e) {
    var img = e.image_url
      ? '<img src="' + esc(e.image_url) + '" loading="lazy"/>'
      : esc(e.emoji);
    var setHtml = '';
    if (e.set) {
      var sideLines = Object.entries(e.choices || {}).map(function(kv) {
        return '<span style="font-weight:700;color:var(--mustard);font-size:.65rem">' + esc(kv[0]) + ':</span> ' + esc(kv[1].emoji + ' ' + kv[1].name);
      }).join('<br>');
      setHtml = '<span class="ci-set-tag">+ ' + esc(e.set.name_jp || e.set.name) + '</span>';
      if (sideLines) setHtml += '<div class="ci-set-choices">' + sideLines + '</div>';
    }
    var priceLabel = e.set
      ? fmt(e.mainPrice, sym) + ' + ' + fmt(e.set.price, sym) + ' set'
      : fmt(e.mainPrice, sym);
    return '<div class="cart-item">'
      + '<div class="ci-thumb">' + img + '</div>'
      + '<div class="ci-info">'
      + '<div class="ci-name">' + esc(e.name) + '</div>'
      + (e.name_jp ? '<div class="ci-jp">' + esc(e.name_jp) + '</div>' : '')
      + setHtml
      + '<div class="ci-price">' + priceLabel + ' each</div>'
      + '</div>'
      + '<div class="ci-right">'
      + '<div class="ci-sub">' + fmt(e.price * e.qty, sym) + '</div>'
      + '<div class="ci-qty-row">'
      + '<button class="ci-qb" data-cid="' + e.cartId + '" data-d="-1">−</button>'
      + '<span class="ci-qnum">' + e.qty + '</span>'
      + '<button class="ci-qb" data-cid="' + e.cartId + '" data-d="1">+</button>'
      + '<button class="ci-rm" data-rm="' + e.cartId + '">🗑</button>'
      + '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  wrap.querySelectorAll('.ci-qb').forEach(function(b) {
    b.addEventListener('click', function() {
      var entry = cart.find(function(x) { return x.cartId === parseInt(b.dataset.cid); });
      if (!entry) return;
      entry.qty = Math.max(1, entry.qty + parseInt(b.dataset.d));
      refreshBadge(); renderCart();
    });
  });
  wrap.querySelectorAll('.ci-rm').forEach(function(b) {
    b.addEventListener('click', function() {
      cart = cart.filter(function(x) { return x.cartId !== parseInt(b.dataset.rm); });
      refreshBadge(); renderCart();
    });
  });

  var t = cartTotal();
  var taxLine = parseFloat(settings.tax || 0) > 0
    ? '<div class="summary-row"><span>Tax (' + settings.tax + '%)</span><span class="amt">' + fmt(Math.round(t.tax), sym) + '</span></div>'
    : '';
  summary.innerHTML = '<div class="summary-row"><span>Subtotal</span><span class="amt">' + fmt(t.sub, sym) + '</span></div>'
    + taxLine
    + '<div class="summary-row total"><span>Total</span><span class="amt">' + fmt(Math.round(t.total), sym) + '</span></div>';
  placeEl.textContent = 'Place Order — Table ' + tableNum;
  placeEl.disabled = false;
}

// Order bar opens cart
document.getElementById('order-bar').addEventListener('click', function() {
  document.getElementById('cart-bg').classList.add('open');
  renderCart();
});
document.getElementById('cart-close').addEventListener('click', function() {
  document.getElementById('cart-bg').classList.remove('open');
});
document.getElementById('cart-bg').addEventListener('click', function(e) {
  if (e.target === document.getElementById('cart-bg')) document.getElementById('cart-bg').classList.remove('open');
});

// ── Place order ───────────────────────────────────────────
document.getElementById('place-btn').addEventListener('click', async function() {
  if (!cart.length) return;
  var btn = document.getElementById('place-btn');
  btn.disabled = true; btn.textContent = 'Sending order…';

  var t     = cartTotal();
  var notes = document.getElementById('f-notes').value.trim() || null;
  var orderRow = { table_num: tableNum, status: 'pending', total: Math.round(t.total) };
  if (notes) orderRow.notes = notes;

  var r1 = await sb.from('orders').insert(orderRow).select().single();
  if (r1.error) {
    toast('Error: ' + r1.error.message, 'error');
    btn.disabled = false; btn.textContent = 'Place Order — Table ' + tableNum;
    return;
  }
  var order = r1.data;

  var itemRows = [];
  var setMap   = [];
  cart.forEach(function(e) {
    itemRows.push({
      order_id:     order.id,
      menu_item_id: e.id,
      item_name:    e.name,
      item_name_jp: e.name_jp || null,
      item_emoji:   e.emoji,
      item_image:   e.image_url || null,
      is_set:       false,
      quantity:     e.qty,
      unit_price:   e.mainPrice,
      prep_status:  JSON.stringify(Array(e.qty).fill(false)),
    });
    if (e.set) {
      setMap.push({ cartEntry: e, setRowIdx: itemRows.length });
      itemRows.push({
        order_id:     order.id,
        menu_item_id: e.set.id,
        item_name:    e.set.name,
        item_name_jp: e.set.name_jp || null,
        item_emoji:   '🍱',
        item_image:   null,
        is_set:       true,
        quantity:     e.qty,
        unit_price:   e.set.price,
        prep_status:  JSON.stringify(Array(e.qty).fill(false)),
      });
    }
  });

  var r2 = await sb.from('order_items').insert(itemRows).select();
  if (r2.error) { toast('Item error: ' + r2.error.message, 'error'); }

  var compRows = [];
  setMap.forEach(function(sm) {
    var setOI = (r2.data || [])[sm.setRowIdx];
    if (!setOI) return;
    Object.entries(sm.cartEntry.choices || {}).forEach(function(kv) {
      compRows.push({ order_item_id: setOI.id, component_name: kv[1].name, component_emoji: kv[1].emoji || '', component_image: kv[1].image || null });
    });
  });
  if (compRows.length) await sb.from('order_item_components').insert(compRows);

  cart = []; refreshBadge();
  document.getElementById('s-num').textContent = '#' + padNum(order.order_number);
  document.getElementById('cart-main-area').style.display = 'none';
  document.getElementById('success-screen').classList.add('show');
  toast('Order placed! 🎉', 'success');
});

document.getElementById('s-track').addEventListener('click', function() {
  resetCart();
  document.getElementById('cart-bg').classList.remove('open');
  openMyOrders();
});
document.getElementById('s-more').addEventListener('click', function() {
  resetCart();
  document.getElementById('cart-bg').classList.remove('open');
});

function resetCart() {
  document.getElementById('success-screen').classList.remove('show');
  document.getElementById('cart-main-area').style.display = 'flex';
  document.getElementById('f-notes').value = '';
  document.getElementById('place-btn').textContent = 'Place Order — Table ' + tableNum;
  document.getElementById('place-btn').disabled = true;
  renderCart();
}

// ── My Orders ─────────────────────────────────────────────
document.getElementById('my-orders-btn').addEventListener('click', openMyOrders);
document.getElementById('os-close').addEventListener('click', function() { document.getElementById('os-bg').classList.remove('open'); });
document.getElementById('os-bg').addEventListener('click', function(e) {
  if (e.target === document.getElementById('os-bg')) document.getElementById('os-bg').classList.remove('open');
});

async function openMyOrders() {
  document.getElementById('os-bg').classList.add('open');
  await renderMyOrders();
}

async function renderMyOrders() {
  var body = document.getElementById('os-body');
  var sym  = settings.currency || '¥';
  body.innerHTML = '<div style="display:flex;justify-content:center;padding:40px"><div class="spin"></div></div>';

  var res = await sb.from('orders')
    .select('*, order_items(*, order_item_components(component_name,component_emoji))')
    .eq('table_num', tableNum)
    .eq('checked_out', false)
    .neq('status', 'cancelled')
    .order('created_at', { ascending: false });

  var orders = res.data || [];
  if (!orders.length) {
    body.innerHTML = '<div class="os-empty"><div class="os-empty-icon">📋</div><p style="font-weight:700">No orders for Table ' + esc(tableNum) + ' yet</p></div>';
    return;
  }

  var STEPS   = ['pending','preparing','ready','done'];
  var hasReady = false;

  body.innerHTML = orders.map(function(o) {
    var si = STEPS.indexOf(o.status);
    if (o.status === 'ready') hasReady = true;
    var mainItems = (o.order_items || []).filter(function(oi) { return !oi.is_set; });
    var setItems  = (o.order_items || []).filter(function(oi) { return  oi.is_set; });

    var progHtml = STEPS.map(function(s, i) {
      var dotCls = i < si ? 'done' : i === si ? 'active' : '';
      var lineCls= i < si ? 'done' : '';
      var labels = { pending:'Received', preparing:'Cooking', ready:'Ready!', done:'Done' };
      return '<div class="prog-step"><div class="prog-dot ' + dotCls + '">' + (i < si ? '✓' : i+1) + '</div><div class="prog-lbl">' + labels[s] + '</div></div>'
        + (i < STEPS.length-1 ? '<div class="prog-line ' + lineCls + '"></div>' : '');
    }).join('');

    var itemsHtml = mainItems.map(function(oi) {
      var img = oi.item_image ? '<img src="' + esc(oi.item_image) + '" loading="lazy"/>' : (oi.item_emoji || '🍽');
      var matchSet = setItems.find(function(s) { return s.quantity === oi.quantity; });
      var sides = matchSet ? (matchSet.order_item_components || []).map(function(c) { return esc((c.component_emoji||'') + ' ' + c.component_name); }).join(' · ') : '';
      return '<div class="oc-item">'
        + '<div class="oc-thumb">' + img + '</div>'
        + '<div style="flex:1"><div class="oc-item-name">' + esc(oi.item_name_jp || oi.item_name) + '</div>'
        + (matchSet ? '<div class="oc-item-sides">+ ' + esc(matchSet.item_name_jp || matchSet.item_name) + (sides ? ' (' + sides + ')' : '') + '</div>' : '')
        + '</div>'
        + '<div class="oc-item-qty">×' + oi.quantity + '</div>'
        + '</div>';
    }).join('');

    return '<div class="order-card ' + o.status + '">'
      + '<div class="oc-top"><div><div class="oc-num">#' + padNum(o.order_number) + '</div><div class="oc-time">' + timeAgo(o.created_at) + '</div></div><div class="oc-status ' + o.status + '">' + o.status + '</div></div>'
      + '<div class="oc-progress">' + progHtml + '</div>'
      + '<div class="oc-items">' + itemsHtml + '</div>'
      + '<div class="oc-total"><span>Total</span><span class="ta">' + fmt(o.total, sym) + '</span></div>'
      + (o.status === 'ready' ? '<div class="ready-notice">🔔 Your order is ready! Please collect at the counter.</div>' : '')
      + '</div>';
  }).join('');

  document.getElementById('ready-dot').style.display = hasReady ? 'block' : 'none';
}

function startPoll() {
  setInterval(async function() {
    if (!tableNum) return;
    var r = await sb.from('orders').select('status').eq('table_num', tableNum).eq('checked_out', false).eq('status', 'ready');
    var has = r.data && r.data.length > 0;
    document.getElementById('ready-dot').style.display = has ? 'block' : 'none';
    if (document.getElementById('os-bg').classList.contains('open')) renderMyOrders();
  }, 20000);
}

function timeAgo(iso) {
  var s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return Math.floor(s / 3600) + 'h ago';
}
</script>
</body>
